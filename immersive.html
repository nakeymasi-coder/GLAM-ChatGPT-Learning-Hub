<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>GLAM ChatGPT Learning Hub — Immersive</title>
<meta name="description" content="Step inside the GLAM ChatGPT Learning Hub and enter each learning experience directly through the immersive environment." />
<style>
:root{--sapphire:#168FEA;--deep:#103B63;--black:#171A1E;--blend:0;--pan-x:0px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;font-family:Montserrat,Arial,sans-serif}button,input{font:inherit}#hub{position:fixed;inset:0;overflow:hidden;background:#020914;touch-action:none}#world{position:absolute;left:50%;top:50%;width:100vw;height:56.28vw;min-width:177.68dvh;min-height:100dvh;transform:translate3d(calc(-50% + var(--pan-x)),-50%,0);transform-origin:center;will-change:transform}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none;transform:translateZ(0)}#day{opacity:calc(1 - var(--blend))}#night{opacity:var(--blend)}.smooth #day,.smooth #night{transition:opacity 1s ease-in-out}.hotspot{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border:1px solid transparent;border-radius:24px;background:transparent;padding:0;cursor:pointer;z-index:5;outline:none;transition:.18s ease}.hotspot span{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%) translateY(4px);background:rgba(4,19,39,.78);color:#fff;border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:800;opacity:0;pointer-events:none;backdrop-filter:blur(10px);transition:.18s ease}.hotspot:hover,.hotspot:focus-visible{border-color:rgba(255,255,255,.72);box-shadow:0 0 0 2px rgba(22,143,234,.45),0 0 28px rgba(22,143,234,.70),inset 0 0 24px rgba(255,255,255,.10)}.hotspot:hover span,.hotspot:focus-visible span{opacity:1;transform:translateX(-50%) translateY(0)}.hotspot:focus-visible{outline:3px solid #fff;outline-offset:3px}#timeControl{position:fixed;z-index:20;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;grid-template-columns:auto minmax(105px,150px) auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.30);border-radius:999px;background:rgba(8,25,49,.42);box-shadow:0 14px 36px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(16px) saturate(140%);color:#fff}.time-label{font-size:12px;font-weight:850;white-space:nowrap}#timeRange{width:100%;accent-color:var(--sapphire)}#timeRange:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:999px}#featureShell{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#f8fbff,#eaf6ff);display:none}#featureShell.open{display:block}#featureFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}#closeFeature{position:fixed;z-index:120;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.72);background:rgba(8,25,49,.74);color:#fff;font-size:26px;line-height:1;box-shadow:0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(14px);cursor:pointer}#featureName{position:fixed;z-index:119;top:max(18px,env(safe-area-inset-top));left:max(74px,calc(env(safe-area-inset-left) + 74px));padding:9px 13px;border-radius:999px;color:#fff;background:rgba(8,25,49,.72);border:1px solid rgba(255,255,255,.30);backdrop-filter:blur(14px);font-weight:850;font-size:13px;pointer-events:none}#assetWarning{position:fixed;left:50%;bottom:18px;z-index:30;transform:translateX(-50%);padding:9px 13px;border-radius:999px;background:rgba(8,25,49,.82);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:12px;display:none}@media(max-width:700px){#timeControl{grid-template-columns:auto 92px auto;gap:6px;padding:9px 10px}.time-label{font-size:11px}.hotspot span{display:none}#closeFeature{width:44px;height:44px}#featureName{left:66px;max-width:calc(100vw - 82px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}@media(prefers-reduced-motion:reduce){.smooth #day,.smooth #night{transition-duration:.2s}}
</style>
</head>
<body>
<main id="hub" aria-label="Immersive GLAM ChatGPT Learning Hub"><div id="world"><img id="day" class="scene" src="immersive-assets/day.webp" alt="" draggable="false" /><img id="night" class="scene" src="immersive-assets/night.webp" alt="" draggable="false" />
<button class="hotspot" style="--x:19.3%;--y:14.4%;--w:10.8%;--h:13.5%" data-tab="academy" aria-label="Open Feature Academy"><span>Feature Academy</span></button>
<button class="hotspot" style="--x:31.1%;--y:9.9%;--w:10.3%;--h:13.5%" data-tab="finder" aria-label="Open Feature Finder"><span>Feature Finder</span></button>
<button class="hotspot" style="--x:40.8%;--y:9.3%;--w:8.8%;--h:13%" data-tab="coach" aria-label="Open Prompt Coach"><span>Prompt Coach</span></button>
<button class="hotspot" style="--x:51%;--y:8.7%;--w:8.6%;--h:13.2%" data-tab="characterlab" aria-label="Open Character Builder"><span>Character Builder</span></button>
<button class="hotspot" style="--x:61.7%;--y:9.7%;--w:9.1%;--h:13%" data-tab="environmentlab" aria-label="Open Background Builder"><span>Background Builder</span></button>
<button class="hotspot" style="--x:71.9%;--y:10.3%;--w:9.1%;--h:13%" data-tab="typographylab" aria-label="Open Typography Builder"><span>Typography Builder</span></button>
<button class="hotspot" style="--x:82%;--y:14.5%;--w:9.4%;--h:13%" data-tab="business" aria-label="Open Business Lab"><span>Business Lab</span></button>
<button class="hotspot" style="--x:13.6%;--y:28.6%;--w:10.7%;--h:13.9%" data-tab="powerwords" aria-label="Open Power Words Lab"><span>Power Words Lab</span></button>
<button class="hotspot" style="--x:28%;--y:28%;--w:8.8%;--h:13.5%" data-tab="clinic" aria-label="Open Prompt Clinic"><span>Prompt Clinic</span></button>
<button class="hotspot" style="--x:72.7%;--y:28.2%;--w:8.8%;--h:13.8%" data-tab="practice" aria-label="Open Practice Lab"><span>Practice Lab</span></button>
<button class="hotspot" style="--x:86.1%;--y:28.2%;--w:10%;--h:13.5%" data-tab="scenarios" aria-label="Open Scenario Coach"><span>Scenario Coach</span></button>
<button class="hotspot" style="--x:20.6%;--y:45.4%;--w:12.3%;--h:14.8%" data-tab="researchlab" aria-label="Open Business Research Lab"><span>Business Research Lab</span></button>
<button class="hotspot" style="--x:79.6%;--y:45.3%;--w:12.7%;--h:14.5%" data-tab="playbook" aria-label="Open My Playbook"><span>My Playbook</span></button>
<button class="hotspot" style="--x:18.2%;--y:65.3%;--w:11.7%;--h:15.7%" data-tab="glossary" aria-label="Open Glossary"><span>Glossary</span></button>
<button class="hotspot" style="--x:38.7%;--y:65.1%;--w:10.3%;--h:16%" data-tab="assessment" aria-label="Open Final Assessment"><span>Final Assessment</span></button>
<button class="hotspot" style="--x:60.1%;--y:65.2%;--w:11%;--h:16%" data-tab="certificate" aria-label="Open Certificate"><span>Certificate</span></button>
<button class="hotspot" style="--x:82.3%;--y:65.2%;--w:11.6%;--h:16%" data-tab="simulator" aria-label="Open Prompt Simulator"><span>Prompt Simulator</span></button>
<button class="hotspot" style="--x:48%;--y:14.5%;--w:9%;--h:12.5%" data-tab="quiz" aria-label="Open Skill Check"><span>Skill Check</span></button>
</div></main>
<div id="timeControl" aria-label="Day and night control"><span class="time-label">☀ Day</span><input id="timeRange" type="range" min="0" max="100" value="0" aria-label="Blend between Day and Night"/><span class="time-label">🌙 Night</span></div><div id="assetWarning">Add day.webp and night.webp to immersive-assets/</div>
<section id="featureShell" aria-hidden="true"><button id="closeFeature" aria-label="Return to Learning Hub">×</button><div id="featureName">Learning Hub</div><iframe id="featureFrame" src="index.html" title="Learning Hub feature"></iframe></section>
<script>
(()=>{const root=document.documentElement,hub=document.getElementById('hub'),world=document.getElementById('world'),range=document.getElementById('timeRange'),shell=document.getElementById('featureShell'),frame=document.getElementById('featureFrame'),close=document.getElementById('closeFeature'),nameChip=document.getElementById('featureName'),warning=document.getElementById('assetWarning');let panning=false,startX=0,startPan=0,pan=0,pendingTab=null;function setBlend(v,smooth=false){v=Math.max(0,Math.min(100,Number(v)||0));document.body.classList.toggle('smooth',smooth);root.style.setProperty('--blend',(v/100).toFixed(3));range.value=v;if(smooth){clearTimeout(setBlend.t);setBlend.t=setTimeout(()=>document.body.classList.remove('smooth'),1050)}}range.addEventListener('input',e=>setBlend(e.target.value));range.addEventListener('keydown',e=>{if(e.key==='Home'){e.preventDefault();setBlend(0,true)}if(e.key==='End'){e.preventDefault();setBlend(100,true)}});function mobile(){return matchMedia('(max-width:700px)').matches}function limits(){const overflow=Math.max(0,world.getBoundingClientRect().width-innerWidth);return{min:-overflow/2,max:overflow/2}}function applyPan(){const l=limits();pan=Math.max(l.min,Math.min(l.max,pan));root.style.setProperty('--pan-x',pan+'px')}hub.addEventListener('pointerdown',e=>{if(!mobile()||e.target.closest('.hotspot'))return;panning=true;startX=e.clientX;startPan=pan;hub.setPointerCapture(e.pointerId)});hub.addEventListener('pointermove',e=>{if(!panning)return;pan=startPan+(e.clientX-startX);applyPan()});hub.addEventListener('pointerup',()=>panning=false);hub.addEventListener('pointercancel',()=>panning=false);addEventListener('resize',applyPan);function prepFrame(){try{const d=frame.contentDocument;if(!d)return;let s=d.getElementById('immersive-reskin-style');if(!s){s=d.createElement('style');s.id='immersive-reskin-style';s.textContent='.announce,header,.hero,.main-tabs{display:none!important}html{scroll-behavior:smooth}body{background:linear-gradient(180deg,#f7fbff,#fff)!important}main{max-width:1260px!important;padding-top:28px!important}';d.head.appendChild(s)}if(pendingTab)openTabInFrame(pendingTab)}catch(err){console.warn(err)}}function openTabInFrame(tab){try{const w=frame.contentWindow,d=frame.contentDocument;if(typeof w.goTab==='function')w.goTab(tab);else{const b=d.querySelector('.tab[data-tab="'+tab+'"]');if(b)b.click()}const p=d.getElementById('panel-'+tab);if(p)p.scrollIntoView({block:'start'});pendingTab=null}catch(err){console.warn(err)}}function openFeature(tab,label){pendingTab=tab;nameChip.textContent=label;shell.classList.add('open');shell.setAttribute('aria-hidden','false');if(frame.contentDocument&&frame.contentDocument.readyState==='complete'){prepFrame();openTabInFrame(tab)}}document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>openFeature(b.dataset.tab,b.textContent.trim())));frame.addEventListener('load',prepFrame);close.addEventListener('click',()=>{shell.classList.remove('open');shell.setAttribute('aria-hidden','true');pendingTab=null});addEventListener('keydown',e=>{if(e.key==='Escape'&&shell.classList.contains('open'))close.click()});document.querySelectorAll('.scene').forEach(img=>img.addEventListener('error',()=>warning.style.display='block'));setBlend(0);applyPan()})();
</script>
</body>
</html>

name: Cleanup GLAM word bank update staging

on:
  push:
    paths:
      - '.github/workflows/cleanup-glam-wordbank-update.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary update files
        shell: bash
        run: |
          rm -rf .glam-update
          rm -f .github/workflows/apply-glam-wordbanks.yml
          rm -f .github/workflows/cleanup-glam-wordbank-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean up GLAM word bank update staging'
          git push

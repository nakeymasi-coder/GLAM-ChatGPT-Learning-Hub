name: Apply Ask ChatGPT Hub Section

on:
  push:
    paths:
      - '.github/workflows/apply-ask-chatgpt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Learning Hub
        run: python scripts/apply_ask_chatgpt.py

      - name: Commit updated hub
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add real-time Ask ChatGPT section"
          git push origin main

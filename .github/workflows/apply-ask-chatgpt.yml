name: Apply Ask ChatGPT Hub Section

on:
  push:
    paths:
      - '.github/workflows/apply-ask-chatgpt.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Ask ChatGPT section to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          if 'id="askChatgptHub"' in text:
              print('Ask ChatGPT section already exists; nothing to patch.')
              raise SystemExit(0)

          css = r'''

      /* Ask ChatGPT — real-time Learning Hub guide */
      .ask-hub {
        margin: 30px 0 4px;
        border: 1px solid rgba(22, 143, 234, 0.24);
        border-radius: 30px;
        background:
          radial-gradient(circle at 92% 8%, rgba(22,143,234,.20), transparent 24%),
          linear-gradient(145deg, #ffffff 0%, #f3faff 58%, #e7f5ff 100%);
        box-shadow: 0 24px 65px rgba(16, 59, 99, 0.12);
        overflow: hidden;
      }
      .ask-hub-inner {
        display: grid;
        grid-template-columns: .82fr 1.18fr;
        gap: 26px;
        padding: 28px;
        align-items: start;
      }
      .ask-hub-copy h2 {
        margin: 7px 0 10px;
        font-size: clamp(31px, 4vw, 49px);
        letter-spacing: -.05em;
        line-height: 1;
      }
      .ask-hub-copy h2 span { color: var(--sapphire); }
      .ask-hub-copy p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }
      .ask-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: #fff;
        border: var(--border);
        color: var(--deep);
        font-size: 11px;
        font-weight: 950;
        text-transform: uppercase;
        letter-spacing: .11em;
      }
      .ask-badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sapphire);
        box-shadow: 0 0 16px rgba(22,143,234,.8);
      }
      .ask-quick {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .ask-quick button {
        border: 1px solid rgba(16,59,99,.12);
        background: #fff;
        color: var(--deep);
        border-radius: 999px;
        padding: 9px 11px;
        font-size: 11px;
        font-weight: 850;
      }
      .ask-quick button:hover {
        border-color: rgba(22,143,234,.45);
        box-shadow: var(--shadow-sm);
      }
      .ask-panel {
        background: rgba(255,255,255,.92);
        border: 1px solid rgba(16,59,99,.11);
        border-radius: 24px;
        padding: 17px;
      }
      .ask-panel label {
        display: block;
        margin-bottom: 8px;
        color: var(--deep);
        font-size: 12px;
        font-weight: 950;
      }
      .ask-panel textarea {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        border: 1px solid rgba(16,59,99,.16);
        border-radius: 17px;
        padding: 14px;
        color: var(--ink);
        background: #fff;
        outline: none;
        line-height: 1.55;
      }
      .ask-panel textarea:focus {
        border-color: rgba(22,143,234,.72);
        box-shadow: 0 0 0 4px rgba(22,143,234,.09);
      }
      .ask-actions {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 11px;
      }
      .ask-status {
        font-size: 11px;
        color: var(--muted);
      }
      .ask-answer {
        display: none;
        margin: 0 28px 28px;
        background: #fff;
        border: 1px solid rgba(22,143,234,.18);
        border-radius: 24px;
        padding: 20px;
      }
      .ask-answer.show { display: block; }
      .ask-answer-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .ask-answer-card {
        border: var(--border);
        border-radius: 18px;
        padding: 14px;
        background: linear-gradient(145deg,#fff,#f8fbfd);
      }
      .ask-answer-card small {
        display: block;
        margin-bottom: 5px;
        color: var(--sapphire);
        font-weight: 950;
        text-transform: uppercase;
        letter-spacing: .08em;
      }
      .ask-answer-card p,
      .ask-answer-card ol { margin: 0; line-height: 1.58; color: var(--ink); }
      .ask-answer-card ol { padding-left: 20px; }
      .ask-copy-box {
        margin-top: 12px;
        padding: 14px;
        border-radius: 17px;
        color: #fff;
        background: linear-gradient(135deg, var(--deep), #0a2945);
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .ask-recommend {
        margin-top: 12px;
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
      }
      .ask-loading {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        color: var(--deep);
        font-weight: 850;
      }
      .ask-spinner {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(22,143,234,.20);
        border-top-color: var(--sapphire);
        animation: askSpin .8s linear infinite;
      }
      @keyframes askSpin { to { transform: rotate(360deg); } }
      @media (max-width: 820px) {
        .ask-hub-inner { grid-template-columns: 1fr; padding: 20px; }
        .ask-answer { margin: 0 20px 20px; }
        .ask-answer-grid { grid-template-columns: 1fr; }
      }
'''

          html = r'''
      <section class="ask-hub" id="askChatgptHub" aria-labelledby="askChatgptTitle">
        <div class="ask-hub-inner">
          <div class="ask-hub-copy">
            <div class="ask-badge"><span class="ask-badge-dot"></span> Real-time AI help</div>
            <h2 id="askChatgptTitle">Ask ChatGPT. <span>Start where you are.</span></h2>
            <p>
              Don't know which feature to use, what to type, or where to begin? Tell the Learning Hub what you're trying to do. It will help you figure out the best feature, give you simple next steps, write a starter prompt, and point you to the right lesson.
            </p>
            <div class="ask-quick" aria-label="Quick question starters">
              <button type="button" data-ask-starter="I don't know where to start. Help me figure out what I need to do first.">I don't know where to start</button>
              <button type="button" data-ask-starter="Which ChatGPT feature should I use for what I'm trying to do? Ask me what I need and help me choose.">Which feature should I use?</button>
              <button type="button" data-ask-starter="Help me write a good prompt for what I'm trying to accomplish.">Help me write my prompt</button>
              <button type="button" data-ask-starter="I need help using ChatGPT for my business. Help me turn my goal into clear next steps.">Help me with my business</button>
              <button type="button" data-ask-starter="Explain what I should do in simple beginner-friendly steps. I will tell you my problem.">Explain it simply</button>
            </div>
          </div>

          <div class="ask-panel">
            <label for="askChatgptInput">What are you trying to do?</label>
            <textarea id="askChatgptInput" placeholder="Example: I want to create a flyer for my business, but I don't know which ChatGPT feature to use or how to ask for what I want."></textarea>
            <div class="ask-actions">
              <button class="btn primary" type="button" id="askChatgptBtn">Ask AI</button>
              <button class="btn secondary" type="button" id="askChatgptClear">Clear</button>
              <span class="ask-status" id="askChatgptStatus">Your API key stays protected on the server.</span>
            </div>
          </div>
        </div>
        <div class="ask-answer" id="askChatgptAnswer" aria-live="polite"></div>
      </section>

'''

          js = r'''

      // Ask ChatGPT — real-time Learning Hub guide
      const askHubHistory = [];
      const ASK_HUB_ENDPOINT = "https://chatgpt-learning-hub.netlify.app/.netlify/functions/ask";

      function askHubEscape(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function askHubCatalog() {
        if (!Array.isArray(lessons)) return [];
        return lessons.map((l) => ({
          id: l.id,
          title: l.title,
          path: l.path,
          desc: l.desc,
        }));
      }

      async function askLearningHub() {
        const input = document.getElementById("askChatgptInput");
        const button = document.getElementById("askChatgptBtn");
        const answerBox = document.getElementById("askChatgptAnswer");
        const status = document.getElementById("askChatgptStatus");
        const question = input.value.trim();

        if (!question) {
          input.focus();
          status.textContent = "Tell me what you're trying to do first.";
          return;
        }

        button.disabled = true;
        button.textContent = "Asking AI…";
        status.textContent = "Working on your question…";
        answerBox.classList.add("show");
        answerBox.innerHTML = `<div class="ask-loading"><span class="ask-spinner"></span>Figuring out the best way to help you…</div>`;

        try {
          const res = await fetch(ASK_HUB_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              question,
              history: askHubHistory,
              catalog: askHubCatalog(),
            }),
          });

          let data;
          try {
            data = await res.json();
          } catch {
            throw new Error("The AI guide returned an unreadable response.");
          }

          if (!res.ok) throw new Error(data.error || "The AI guide could not answer right now.");

          askHubHistory.push({ role: "user", content: question });
          askHubHistory.push({ role: "assistant", content: data.answer || "" });
          if (askHubHistory.length > 8) askHubHistory.splice(0, askHubHistory.length - 8);

          const steps = Array.isArray(data.nextSteps) ? data.nextSteps : [];
          const lessonExists = data.lessonId && Array.isArray(lessons) && lessons.some((l) => l.id === data.lessonId);

          answerBox.innerHTML = `
            <div class="kicker">Your AI guide</div>
            <h3 style="margin:5px 0 7px;font-size:25px;letter-spacing:-.035em;">${askHubEscape(data.answer || "Here's where I'd start.")}</h3>
            <div class="ask-answer-grid">
              <div class="ask-answer-card">
                <small>What you're trying to do</small>
                <p>${askHubEscape(data.whatYouNeed || "")}</p>
              </div>
              <div class="ask-answer-card">
                <small>Best ChatGPT feature</small>
                <p>${askHubEscape(data.bestFeature || "")}</p>
              </div>
              <div class="ask-answer-card">
                <small>Your next steps</small>
                <ol>${steps.map((step) => `<li>${askHubEscape(step)}</li>`).join("")}</ol>
              </div>
              <div class="ask-answer-card">
                <small>Ask me next</small>
                <p>${askHubEscape(data.followUp || "Tell me what part you want help with next.")}</p>
              </div>
            </div>
            <div class="ask-answer-card" style="margin-top:12px;">
              <small>Starter prompt — copy this into ChatGPT</small>
              <div class="ask-copy-box" id="askHubCopyPrompt">${askHubEscape(data.copyPrompt || "")}</div>
              <div class="ask-recommend">
                <button class="btn secondary" type="button" id="askHubCopyBtn">Copy Prompt</button>
                ${lessonExists ? `<button class="btn primary" type="button" id="askHubLessonBtn">Open lesson: ${askHubEscape(data.lessonTitle)}</button>` : ""}
              </div>
            </div>`;

          const copyBtn = document.getElementById("askHubCopyBtn");
          if (copyBtn) {
            copyBtn.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(data.copyPrompt || "");
                copyBtn.textContent = "Copied!";
                setTimeout(() => (copyBtn.textContent = "Copy Prompt"), 1400);
              } catch {
                copyBtn.textContent = "Select + copy the prompt above";
              }
            });
          }

          const lessonBtn = document.getElementById("askHubLessonBtn");
          if (lessonBtn && lessonExists) {
            lessonBtn.addEventListener("click", () => openLesson(data.lessonId));
          }

          status.textContent = "Ask a follow-up anytime — this box remembers the last few messages in this session.";
          input.value = "";
        } catch (error) {
          answerBox.innerHTML = `
            <div class="ask-answer-card">
              <small>Couldn't connect</small>
              <p>${askHubEscape(error.message || "Ask ChatGPT is temporarily unavailable.")}</p>
              <p style="margin-top:8px;color:var(--muted);font-size:12px;">If you're previewing on GitHub Pages before the new Netlify function is deployed, the interface will appear here but real-time AI answers will start working after the next Netlify deployment.</p>
            </div>`;
          status.textContent = "Your question is still in the box so you can try again.";
        } finally {
          button.disabled = false;
          button.textContent = "Ask AI";
        }
      }

      document.querySelectorAll("[data-ask-starter]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById("askChatgptInput");
          input.value = button.dataset.askStarter || "";
          input.focus();
        });
      });

      document.getElementById("askChatgptBtn")?.addEventListener("click", askLearningHub);
      document.getElementById("askChatgptClear")?.addEventListener("click", () => {
        const input = document.getElementById("askChatgptInput");
        const answer = document.getElementById("askChatgptAnswer");
        const status = document.getElementById("askChatgptStatus");
        input.value = "";
        answer.classList.remove("show");
        answer.innerHTML = "";
        askHubHistory.splice(0, askHubHistory.length);
        status.textContent = "Your API key stays protected on the server.";
        input.focus();
      });
'''

          css_anchor = '      .hero {\n'
          if css_anchor not in text:
              raise SystemExit('Could not find hero CSS anchor.')
          text = text.replace(css_anchor, css + '\n' + css_anchor, 1)

          html_anchor = '    <main>\n      <section class="hero">\n'
          if html_anchor not in text:
              raise SystemExit('Could not find main/hero HTML anchor.')
          text = text.replace(html_anchor, '    <main>\n' + html + '      <section class="hero">\n', 1)

          script_anchor = '</script>'
          idx = text.rfind(script_anchor)
          if idx == -1:
              raise SystemExit('Could not find closing script tag.')
          text = text[:idx] + js + '\n    ' + text[idx:]

          p.write_text(text, encoding='utf-8')
          print('Ask ChatGPT section patched into index.html')
          PY

      - name: Commit updated hub
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add real-time Ask ChatGPT section"
          git push origin main

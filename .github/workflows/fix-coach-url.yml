name: Fix Coach URL

on:
  push:
    paths:
      - '.github/workflows/fix-coach-url.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace coach endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'fetch("/.netlify/functions/coach", {'
          new = 'fetch("https://chatgpt-learning-hub.netlify.app/.netlify/functions/coach", {'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 coach endpoints, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print(f'Replaced {count} coach endpoints')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix AI Coach Netlify endpoint"
          git push

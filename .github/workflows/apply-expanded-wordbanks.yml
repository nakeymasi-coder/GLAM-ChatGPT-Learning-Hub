name: Apply expanded word banks

on:
  push:
    paths:
      - '.glam-update/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild index.html
        run: |
          cat .glam-update/chunk-* > index.html
          rm -rf .glam-update
          rm -f .github/workflows/apply-expanded-wordbanks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand GLAM Learning Hub word banks"
          git push

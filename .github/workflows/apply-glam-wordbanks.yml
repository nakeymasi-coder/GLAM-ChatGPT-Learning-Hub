name: Apply GLAM word bank expansion

on:
  push:
    paths:
      - '.github/workflows/apply-glam-wordbanks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and apply GLAM patch
        shell: bash
        run: |
          cat .glam-update/part-* > /tmp/glam.patch
          git apply --check /tmp/glam.patch
          git apply --whitespace=nowarn /tmp/glam.patch

      - name: Verify expanded Power Word Vault
        shell: bash
        run: |
          grep -q 'powerWordSearch' index.html
          grep -q 'randomPowerStack' index.html
          grep -q 'Clamshell beauty lighting' index.html
          grep -q 'Luxury packaging quality' index.html
          grep -q 'Dichroic glass' index.html
          grep -q 'Surreal advertising realism' index.html

      - name: Commit expanded Learning Hub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand GLAM Learning Hub word banks'
          git push

name: Apply GLAM word bank expansion

on:
  push:
    paths:
      - '.github/workflows/apply-glam-wordbanks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply GLAM patch
        shell: bash
        run: |
          cat .glam-update/part-00 .glam-update/part-02 .glam-update/part-03 .glam-update/part-04 .glam-update/part-05 .glam-update/part-06 .glam-update/part-07 .glam-update/part-08 .glam-update/part-09 > /tmp/glam.patch
          test "$(wc -c < /tmp/glam.patch)" -eq 75864
          if git apply --check /tmp/glam.patch; then
            git apply --whitespace=nowarn /tmp/glam.patch
          else
            git apply --3way --whitespace=nowarn /tmp/glam.patch
          fi

      - name: Verify expanded Power Word Vault
        shell: bash
        run: |
          grep -q 'powerWordSearch' index.html
          grep -q 'randomPowerStack' index.html
          grep -q 'Clamshell beauty lighting' index.html
          grep -q 'Luxury packaging quality' index.html
          grep -q 'Dichroic glass' index.html
          grep -q 'Surreal advertising realism' index.html

      - name: Commit expanded Learning Hub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand GLAM Learning Hub word banks'
          git push

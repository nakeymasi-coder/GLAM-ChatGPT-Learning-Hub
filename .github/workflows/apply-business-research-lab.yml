name: Apply Business Research Lab
on:
  push:
    paths:
      - '.github/tmp-business-lab-6.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and clean staging files
        shell: bash
        run: |
          cat .github/tmp-business-lab-{1..6}.b64 | base64 -d > /tmp/business-lab.patch
          git apply /tmp/business-lab.patch
          rm .github/tmp-business-lab-{1..6}.b64
          rm .github/workflows/apply-business-research-lab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github
          git commit -m "Add Business Research Lab"
          git push origin HEAD:main

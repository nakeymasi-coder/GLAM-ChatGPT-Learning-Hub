name: Fix Coach JSON Truncation

on:
  push:
    paths:
      - '.github/workflows/fix-coach-json-truncation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase AI Coach output allowance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('netlify/functions/coach.js')
          s = p.read_text(encoding='utf-8')
          old = 'max_output_tokens: 1400'
          new = 'max_output_tokens: 4000'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 max_output_tokens setting, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Updated max_output_tokens from 1400 to 4000')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/coach.js
          git commit -m "Prevent AI Coach JSON truncation"
          git push
